[project]
name = "apptutorial"
version = "0.1.0"
description = "AI-powered on-screen software tutor for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
    "mss>=9.0",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "Pillow>=10.0",
    "anthropic>=0.70",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[project.scripts]
apptutorial = "apptutorial.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
